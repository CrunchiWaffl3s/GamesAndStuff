<!DOCTYPE html>
<html lang="en" class="bg-gradient-to-br from-[#ff0000] to-[#0000ff] bg-fixed">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Games & Stuff</title>
        <link rel="icon" href="/logo.png" type="image/x-icon"> 
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <script src="https://cdn.tailwindcss.com"></script>
        <script>tailwind.config = {theme: {extend: {fontFamily: {sans: ['Montserrat', 'sans-serif'], },}},}</script>
    </head>
    <body class="m-0 font-sans overflow-y-auto min-h-screen">
        <aside id="sidebar-menu" class="fixed top-0 left-0 h-full w-64 p-6 z-20 transform -translate-x-full transition duration-300 ease-in-out flex flex-col">
            <nav class="flex flex-col flex-grow justify-around py-10">
                <a href="/games.html" class="block text-4xl font-semibold transition duration-150 transform hover:translate-x-4 flex"><div data-lucide="gamepad-2" class="w-10 h-10 mr-4 ml-2"></div>Games</a>
                <a href="/themes.html" class="block text-4xl font-semibold transition duration-15 transform hover:translate-x-4 flex"><div data-lucide="palette" class="w-10 h-10 mr-4 ml-2"></div>Themes</a>
                <a href="/credits.html" class="block text-4xl font-semibold transition duration-150 transform hover:translate-x-4 flex"><div data-lucide="scroll-text" class="w-10 h-10 mr-4 ml-2"></div>Credits</a>
            </nav>
        </aside>
        <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 opacity-0 pointer-events-none z-10 backdrop-blur-xl transition-opacity duration-300 ease-in-out"></div>
        <nav class="fixed top-2 left-2 right-2 p-3 sm:top-5 sm:left-5 sm:right-5 sm:p-5 rounded-[40px] flex items-center justify-between z-10 space-x-2 sm:space-x-6">
            <button id="menu-button" class="backdrop-blur-xl p-3 rounded-full flex-shrink-0 border-solid border-2">
                <div data-lucide="menu" class="w-12 h-12"></div>
            </button>
            <div class="p-3 rounded-full flex items-center space-x-4 border-solid border-2 backdrop-blur-xl">
                <div id="fps-status" class="px-4 py-2 rounded-full text-sm font-bold border-solid border-2"></div>
                <div id="time-status" class="px-4 py-2 rounded-full text-sm font-bold border-solid border-2"></div>
                <div id="battery-status" class="px-4 py-2 rounded-full text-sm font-bold border-solid border-2"></div>
            </div>
            <a class="backdrop-blur-xl p-3 rounded-full flex-shrink-0 border-solid border-2" href="/index.html" title="Home">
                <img src="/logo.png" class="w-12 h-12 object-contain rounded-full">
            </a>
        </nav>
        <div class="max-w-2xl mx-auto pt-40 pb-10">
            <h1 class="text-5xl font-extrabold mb-8 text-center tracking-tight">Add New Game</h1>
            <p class="text-lg mb-8 text-center">Note: This will not add a game to a server. All games that you add are locally stored to the site. Please make sure you obtain these games legally.</p>
            <div id="method-selection" class="flex justify-center gap-4 mb-8">
                <button data-method="repo" class="method-btn px-6 py-4 rounded-full border-2">GitHub Repo</button>
                <button data-method="embed" class="method-btn px-6 py-4 rounded-full border-2">Embed Link</button>
            </div>
            <form id="addGameForm" class="flex flex-col space-y-6 p-6 rounded-3xl hidden border-2">
                <div id="dynamic-input"></div>
                <div>
                    <label for="gameName" class="block mb-2 font-bold text-lg">Game Name *</label>
                    <input type="text" id="gameName" required placeholder="Enter game name"
                        class="w-full px-4 py-3 rounded-full bg-transparent border-2 focus:outline-none">
                </div>
                <div>
                    <label for="gameImage" class="block mb-2 font-bold text-lg">Game Image URL / Upload (Optional)</label>
                    <input type="text" id="imageLink" placeholder="https://example.com/image.png" class="w-full px-4 py-3 rounded-full bg-transparent border-2 focus:outline-none mb-2">
                    <input type="file" id="imageUpload" accept="image/*" class="relative w-full px-4 py-3 rounded-full bg-transparent overflow-hidden border-2 rounded-full text-base focus:outline-hidden cursor-pointer">
                </div>
                <button type="submit" class="px-6 py-3 rounded-full border-2">Add Game</button>
            </form>
        </div>
        <script src="themes.js"></script>
        <script src="index.js"></script>
        <script src="add.js"></script>
        <script src="https://unpkg.com/lucide@latest"></script>
        <script>lucide.createIcons();</script>
    </body>
</html>
