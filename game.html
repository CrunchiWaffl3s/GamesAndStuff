<!DOCTYPE html>
<html lang="en" data-theme="normal">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Games & Stuff</title>
      <link rel="icon" type="image/png" href="logo.png">
      <link rel="stylesheet" href="style.css">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded"/>
      <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <main class="w-screen h-screen p-6 box-border grid grid-cols-[30vw_1fr] grid-rows-[1fr_9vh] gap-6 overflow-hidden">
      <div id="info-panel" class="row-span-2 text-center flex flex-col justify-center items-center bg-white/10 rounded-2xl h-full">
        <h1 id="info-title" class="font-semibold text-5xl m-10"></h1>
        <span id="battery" class="flex align-center"></span>
        <span id="time" class="flex align-center mt-2"></span>
      </div>
      <div class="w-full h-full rounded-2xl overflow-hidden">
        <iframe id="frame" class="w-full h-full border-none block"></iframe>
      </div>
      <div id="toolbar" class="bg-white/10 rounded-2xl h-full flex items-center justify-center gap-10">
        <a id="fs-btn" class="material-symbols-rounded" title="Fullscreen">fullscreen</a>
        <a id="newtab-btn" class="material-symbols-rounded" title="Open in about:blank">open_in_new</a>
        <a id="reload-btn" class="material-symbols-rounded" title="Refresh Game">refresh</a>
        <a id="home-btn" class="material-symbols-rounded" title="Home">home</a>
      </div>
    </main>
    <button id="btn" class="cursor-pointer material-symbols-rounded absolute top-4 left-4 z-50" style="font-size: 4rem;">menu</button>
    <div id="panel" class="fixed inset-0 flex items-center h-screen w-screen z-20"> 
      <ul class="text-[3.5vw] font-[550] space-y-[4vh] mt-[5vh] ml-[3vw] bg-zinc-300/20 p-[3vw] pr-[5vw] rounded-[3vw] backdrop-blur-3xl"> 
        <a href="/" class="flex items-center gap-[1vw] transition-transform duration-300 hover:translate-x-[0.5vw] text-shadow-lg"> 
          <span class="material-symbols-rounded" style="font-size: 3.5vw;">home</span> Home
        </a> 
        <a href="/games.html" class="flex items-center gap-[1vw] transition-transform duration-300 hover:translate-x-[0.5vw] text-shadow-lg"> 
          <span class="material-symbols-rounded" style="font-size: 3.5vw;">stadia_controller</span> Games
        </a> 
        <a href="/settings.html" class="flex items-center gap-[1vw] transition-transform duration-300 hover:translate-x-[0.5vw] text-shadow-lg"> 
          <span class="material-symbols-rounded" style="font-size: 3.5vw;">settings</span> Settings
        </a> 
        <a href="/credits.html" class="flex items-center gap-[1vw] transition-transform duration-300 hover:translate-x-[0.5vw] text-shadow-lg"> 
          <span class="material-symbols-rounded" style="font-size: 3.5vw;">patient_list</span> Credits
        </a> 
      </ul> 
    </div>
  </body>
  <script src="main.js"></script>
  <script src="games.js"></script>
</html>
