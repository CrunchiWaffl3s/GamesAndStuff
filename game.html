<!DOCTYPE html>
<html lang="en" class="bg-gradient-to-br from-[#ff0000] to-[#0000ff] bg-fixed">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games & Stuff</title>
    <link rel="icon" href="/logo.png" type="image/x-icon"> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
    theme: {
        extend: {
        fontFamily: {
            sans: ['Montserrat', 'sans-serif'],
        },
        },
    },
    plugins: [
        function ({ addVariant }) {
        addVariant('fullscreen', '&:fullscreen');
        addVariant('webkit-fullscreen', '&:-webkit-full-screen');
        },
    ],
    }
    </script>
</head>
<body class="m-0 font-sans overflow-y-auto min-h-screen">
    <aside id="sidebar-menu" class="fixed top-0 left-0 h-full w-64 p-6 z-20 transform -translate-x-full transition duration-300 ease-in-out flex flex-col">
        <nav class="flex flex-col flex-grow justify-around py-10">
            <a href="/games.html" class="block text-4xl font-semibold transition duration-150 transform hover:translate-x-4 flex"><div data-lucide="gamepad-2" class="w-10 h-10 mr-4 ml-2"></div>Games</a>
            <a href="/themes.html" class="block text-4xl font-semibold transition duration-15 transform hover:translate-x-4 flex"><div data-lucide="palette" class="w-10 h-10 mr-4 ml-2"></div>Themes</a>
            <a href="/credits.html" class="block text-4xl font-semibold transition duration-150 transform hover:translate-x-4 flex"><div data-lucide="scroll-text" class="w-10 h-10 mr-4 ml-2"></div>Credits</a>
        </nav>
    </aside>
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 opacity-0 pointer-events-none z-10 backdrop-blur-xl transition-opacity duration-300 ease-in-out"></div>
    <nav class="fixed top-2 left-2 right-2 p-3 sm:top-5 sm:left-5 sm:right-5 sm:p-5 rounded-[40px] flex items-center justify-between z-10 space-x-2 sm:space-x-6">
        <button id="menu-button" class="backdrop-blur-xl p-3 rounded-full flex-shrink-0 border-solid border-2">
            <div data-lucide="menu" class="w-12 h-12"></div>
        </button>
        <div class="p-3 rounded-full flex items-center space-x-4 border-solid border-2 backdrop-blur-xl">
            <div id="fps-status" class="px-4 py-2 rounded-full text-sm font-bold border-solid border-2"></div>
            <div id="time-status" class="px-4 py-2 rounded-full text-sm font-bold border-solid border-2"></div>
            <div id="battery-status" class="px-4 py-2 rounded-full text-sm font-bold border-solid border-2"></div>
        </div>
        <a class="backdrop-blur-xl p-3 rounded-full flex-shrink-0 border-solid border-2" href="/index.html" title="Home">
            <img src="/logo.png" class="w-12 h-12 object-contain rounded-full">
        </a>
    </nav>
    <main class="max-w-7xl mx-auto p-4 pt-32">
        <div id="game-display-container" class="lg:flex lg:flex-row lg:space-x-8">
            <div id="game-player-area" class="lg:w-2/3">
                <div id="game-iframe-container" class="relative rounded-3xl border-solid border-2 overflow-hidden fullscreen:rounded-none fullscreen:border-0 fullscreen:overflow-visible" style="aspect-ratio: 16 / 9;">
                    <iframe id="game-iframe" src="" allowfullscreen class="absolute top-0 left-0 w-full h-full border-0"></iframe>
                </div>

                <div id="control-panel" class="flex justify-center mt-6 mb-6">
                    <div class="flex space-x-4 p-3 rounded-full border-solid border-2">
                        <button id="fullscreen-btn" class="control-btn" onclick="toggleFullscreen()"><i data-lucide="maximize-2" class="w-6 h-6"></i></button>
                        <button id="reload-btn" class="control-btn" onclick="reloadGame()"><i data-lucide="rotate-cw" class="w-6 h-6"></i></button>
                        <a id="home-btn" href="/index.html" class="control-btn"><i data-lucide="home" class="w-6 h-6"></i></a>
                    </div>
                </div>
            </div>

            <div id="metadata-panel" class="lg:w-1/3 mb-8 lg:mb-0 p-4 sm:p-6 rounded-3xl border-solid border-2" style="height: 50%; margin-top: 0;">
                <div class="flex items-center h-full space-x-4">
                    <div id="game-cover-placeholder" class="w-1/3 aspect-square rounded-2xl overflow-hidden border-solid border-2 flex items-center justify-center">
                        <i data-lucide="gamepad-2" class="w-20 h-20"></i>
                    </div>
                    <h1 id="game-title" class="text-4xl font-bold text-center"></h1>
                </div>
            </div>
        </div>
    </main>

    <script src="themes.js"></script>
    <script src="index.js"></script>
    <script src="game.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
