<!DOCTYPE html>
<html lang="en" data-theme="normal">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Games & Stuff</title>
      <link rel="icon" type="image/png" href="logo.png">
      <link rel="stylesheet" href="style.css">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded"/>
      <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <main class="flex min-h-screen items-center justify-center px-4">
      <div class="w-full max-w-md rounded-3xl bg-white/10 p-6 shadow-2xl backdrop-blur-xl">
        <h2 class="text-3xl font-semibold">Themes</h2>
        <div class="mt-2 grid grid-cols-3 gap-2">
          <button onclick="setTheme('normal')" class="theme-buttons">Normal</button>
          <button onclick="setTheme('dark')" class="theme-buttons">Dark</button>
          <button onclick="setTheme('light')" class="theme-buttons">Light</button>
          <button onclick="setTheme('oled')" class="theme-buttons">OLED</button>
          <button onclick="setTheme('pink')" class="theme-buttons">Pink</button>
          <button onclick="setTheme('green')" class="theme-buttons">Green</button>
        </div>
        <h3 class="mt-4 font-semibold">Custom background:</h3>
        <input class="outline-none" type="text" id="bgHex" placeholder="(e.g. #000000)">
        <h3 class="mt-2 font-semibold">Custom text color:</h3>
        <input class="outline-none" type="text" id="textHex" placeholder="(e.g. #000000)">
      </div>
    </main>
    <button id="btn" class="material-symbols-rounded absolute top-4 left-4 z-50 cursor-pointer" style="font-size: 4rem;">menu</button>
    <div id="panel" class="h-screen w-screen z-20 flex items-center">
      <ul class="text-5xl font-[550] space-y-18 m-10">
        <a href="/" class="flex align-center gap-2 transition-transform duration-300 hover:translate-x-4">
          <span class="material-symbols-rounded" style="font-size: 3rem;">home</span>
        Home</a>
        <a href="/games.html" class="flex align-center gap-2 transition-transform duration-300 hover:translate-x-4">
          <span class="material-symbols-rounded" style="font-size: 3rem;">stadia_controller</span>
        Games</a>
        <a href="/settings.html" class="flex align-center gap-2 transition-transform duration-300 hover:translate-x-4">
          <span class="material-symbols-rounded" style="font-size: 3rem;">settings</span>
        Settings</a>
        <a href="/credits.html" class="flex align-center gap-2 transition-transform duration-300 hover:translate-x-4">
          <span class="material-symbols-rounded" style="font-size: 3rem;">patient_list</span>
        Credits</a>
      </ul>
    </div>
  </body>
  <script src="main.js"></script>
  <script src="theme.js"></script>
</html>
